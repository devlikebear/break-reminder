name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. "none" releases the VERSION file as it is.'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # On a tag push the tag is the source of truth. On a manual run the
      # VERSION file is, optionally bumped first. Nothing is committed yet:
      # main stays untouched until the build and tests pass.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "BUMPED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(tr -d '[:space:]' < VERSION)
          if ! echo "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file is not semver: $CURRENT"
            exit 1
          fi

          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "none" ]; then
            echo "VERSION=v${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "BUMPED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $CURRENT -> $NEXT ($BUMP)"

          echo "$NEXT" > VERSION

          # Turn the Unreleased section into the new release section.
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk -v v="$NEXT" -v d="$(date +%F)" '
              !inserted && /^## \[Unreleased\]/ {
                print; print ""; print "## [" v "] - " d; inserted = 1; next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            echo "::warning::No '## [Unreleased]' heading in CHANGELOG.md, skipping changelog update"
          fi

          echo "VERSION=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "BUMPED=true" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify tag does not exist yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Pick a bump, or delete the tag first."
            exit 1
          fi

      - name: Build Go binary
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o bin/break-reminder ./cmd/break-reminder

      - name: Build Swift helpers
        run: |
          cd helpers && swift build -c release
          cp .build/release/BreakScreenApp ../bin/break-screen
          cp .build/release/DashboardApp ../bin/break-dashboard
          cp .build/release/MenuBarApp ../bin/break-menubar

      - name: Run tests
        run: |
          go test ./...
          cd helpers && swift test

      - name: Commit version bump
        if: steps.version.outputs.BUMPED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore: prepare ${{ steps.version.outputs.VERSION }} release"
          git push

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: Create archive
        run: |
          cd bin
          tar czf break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz \
            break-reminder break-screen break-dashboard break-menubar
          shasum -a 256 break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz \
            > break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            bin/break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            bin/break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz.sha256

      - name: Update local formula
        run: |
          SHA256=$(cat bin/break-reminder-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz.sha256 | awk '{print $1}')
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i '' "s|url \".*\"|url \"https://github.com/devlikebear/break-reminder/releases/download/${VERSION}/break-reminder-${VERSION}-darwin-arm64.tar.gz\"|" Formula/break-reminder.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/break-reminder.rb
          sed -i '' "s|version \".*\"|version \"${VERSION#v}\"|" Formula/break-reminder.rb

      - name: Commit local formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add Formula/break-reminder.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula to ${{ steps.version.outputs.VERSION }}"
          git push

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          cd /tmp
          git clone https://x-access-token:${TAP_TOKEN}@github.com/devlikebear/homebrew-tap.git
          cd homebrew-tap
          cp "${GITHUB_WORKSPACE}/Formula/break-reminder.rb" Formula/break-reminder.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/break-reminder.rb
          git diff --cached --quiet || git commit -m "Update break-reminder to ${{ steps.version.outputs.VERSION }}"
          git push
